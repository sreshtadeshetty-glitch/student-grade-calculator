<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Student Grade Calculator</h1>
        <label for="stdname">Student Name:</label>
        <input id="stdname" type="text" placeholder="Enter your name">
        <label for="math">Mathematics:</label>
        <input type="number" id="math" placeholder="Enter marks" min="0"  max="100">
        <label for="physics">Physics:</label>
        <input type="number" id="physics" placeholder="Enter marks" min="0" max="100">
        <label for="chemistry">Chemistry:</label>
        <input type="number" id="chemistry" placeholder="Enter marks" min="0" max="100">
        <label for="english">English:</label>
        <input type="number" id="english" placeholder="Enter marks" min="0" max="100">
        <label for="computer">Computer Science:</label>
        <input
            type="number" id="computer" placeholder="Enter marks" min="0" max="100">
        <div class="buttons">
            <button id="calculatebtn">Calculate Grade</button>
            <button id="resetBtn">Reset</button>
        </div>
        <p id="errorMessage"></p>
        <div id="result">
            <h2>RESULT CARD</h2>
            <p>
                Student:
                <span id="studentResult">-</span>
            </p>
            <div class="subject-marks">
                <p>
                    <span>Mathematics</span>
                    <span id="mathResult">-</span>
                </p>
                <p>
                    <span>Physics</span>
                    <span id="physicsResult">-</span>
                </p>
                <p>
                    <span>Chemistry</span>
                    <span id="chemistryResult">-</span>
                </p>
                <p>
                    <span>English</span>
                    <span id="englishResult">-</span>
                </p>
                <p>
                    <span>Computer Science</span>
                    <span id="computerResult">-</span>
                </p>
            </div>
            <hr>
            <p>
                Total:
                <span id="totalResult">-</span> / 500
            </p>
            <p>
                Percentage:
                <span id="percentageResult">-</span>%
            </p>
            <p>
                Grade:
                <span id="gradeResult">-</span>
            </p>
            <p>
                Status:
                <span id="statusResult">-</span>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
